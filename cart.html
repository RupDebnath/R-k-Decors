<script>
function loadCartPage(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let box = document.getElementById("cartPageItems");
  let totalBox = document.getElementById("cartPageTotal");

  if(cart.length === 0){
    box.innerHTML = "<p style='text-align:center;'>Cart is empty</p>";
    totalBox.innerHTML = "";
    return;
  }

  box.innerHTML = "";
  let total = 0;

  cart.forEach((c,i)=>{
    let sub = c.price * c.qty;
    total += sub;

    box.innerHTML += `
      <div class="card" style="margin-bottom:15px;">
        <img src="${c.img}" style="width:300px; height:200px; object-fit:cover;"><br>

        <h3>${c.name}</h3>
        <p>₹${c.price}</p>

        <div class="qty-box">
          <button onclick="changeQtyPage(${i},-1)">-</button>
          ${c.qty}
          <button onclick="changeQtyPage(${i},1)">+</button>
        </div>

        <p>Subtotal: ₹${sub}</p>

        <button onclick="removeItemPage(${i})">Remove</button>
      </div>
    `;
  });

  totalBox.innerHTML = "Total: ₹" + total;
}

// 🔄 SYNC FUNCTIONS
function changeQtyPage(i,val){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart[i].qty += val;
  if(cart[i].qty <= 0){
    cart.splice(i,1);
  }

  localStorage.setItem("cart", JSON.stringify(cart));

  loadCartPage();

  // 🔥 sync sidebar
  if(typeof loadCart === "function") loadCart();
}

function removeItemPage(i){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.splice(i,1);

  localStorage.setItem("cart", JSON.stringify(cart));

  loadCartPage();

  // 🔥 sync sidebar
  if(typeof loadCart === "function") loadCart();
}

// 🔄 AUTO SYNC WHEN STORAGE CHANGES
window.addEventListener("storage", ()=>{
  loadCartPage();
});

loadCartPage();
</script>
